name: SACRAMENTUM - Auditoría V90

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-funcionales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Recuperación de interfaz matrimonial en Chrome aislado
        run: node scripts/audit-seat-recovery-browser-v205.mjs
      - name: Recuperación de Bautismo Confirmación y Exequias en Chrome aislado
        run: node scripts/audit-three-sacrament-recovery-browser-v206.mjs
      - name: Creación de boletas y recuperación de respuestas perdidas en Chrome
        run: node scripts/audit-pending-creation-browser-v207.mjs
      - name: Documentos reales React con datos ficticios aislados en Chrome
        run: node scripts/audit-document-details-browser-v211.mjs
      - name: Centro de Migración React con archivos y servicios ficticios en Chrome
        run: node scripts/audit-legacy-migration-browser-v216.mjs
      - name: Conciliación histórica de Cancillería en Chrome aislado
        run: node scripts/audit-historical-link-review-browser-v219.mjs
      - name: Ensayos sintéticos sin acceso a producción
        run: node --test scripts/test-sistema-integral-v89.mjs scripts/test-chancery-decrees-v88.mjs scripts/test-supplementary-preflight-v89.mjs scripts/test-privileged-sequences-v92.mjs scripts/test-pending-ownership-v93.mjs scripts/test-parish-book-ownership-v94.mjs scripts/test-parish-auxiliary-ownership-v95.mjs scripts/test-institutional-identity-v96.mjs scripts/test-decree-concept-authority-v97.mjs scripts/test-legacy-concept-provenance-v98.mjs scripts/test-legacy-import-provenance-v99.mjs scripts/test-legacy-role-scope-v100.mjs scripts/test-legacy-admin-unscoped-v101.mjs scripts/test-document-authority-v102.mjs scripts/test-historical-maintenance-privileges-v103.mjs scripts/test-decree-authority-v104.mjs scripts/test-nullity-baptism-link-v105.mjs scripts/test-nullity-receipt-authority-v106.mjs scripts/test-nullity-judicial-review-v107.mjs scripts/test-nullity-court-correspondence-v108.mjs scripts/test-court-decision-receipt-v109.mjs scripts/test-dual-control-court-receipts-v110.mjs scripts/test-migration-provenance-v112.mjs scripts/test-complete-fictional-decree-matrix-v114.mjs scripts/test-register-effects-migrations-v116.mjs scripts/test-legacy-decrees-v118.mjs scripts/test-browser-and-historical-rls-v120.mjs scripts/test-physical-provenance-rls-v121.mjs scripts/test-rpc-hardening-v123.mjs scripts/test-shadow-role-authority-v124.mjs scripts/test-matrimonial-scope-and-historical-import-v126.mjs scripts/test-tailwind4-dependency-remediation-v127.mjs scripts/test-nullity-institutional-preflight-v130.mjs scripts/test-nullity-browser-v131.mjs scripts/test-marginal-receipt-authority-v133.mjs scripts/test-physical-notification-guard-v134.mjs scripts/test-stale-registral-reversals-v135.mjs scripts/test-stale-baptism-confirmation-v136.mjs scripts/test-later-linked-decree-v137.mjs scripts/test-unique-reversal-audit-snapshot-v138.mjs scripts/test-official-notification-and-print-v139.mjs scripts/test-registry-print-marginal-integrity-v140.mjs scripts/test-print-receipt-consistency-v142.mjs scripts/test-stale-print-coordinates-v143.mjs scripts/test-print-request-lineage-v146.mjs scripts/test-monotonic-sacrament-version-v148.mjs scripts/test-registry-version-microseconds-v149.mjs scripts/test-parish-authorization-fail-closed-v150.mjs scripts/test-legacy-materializer-role-scope-v151.mjs scripts/test-rpc-inventory-reconciliation-v151.mjs scripts/test-documentary-decree-lifecycle-v152.mjs scripts/test-baptism-confirmation-decree-integrity-v153.mjs scripts/test-independent-marginal-note-chain-v154.mjs scripts/test-marriage-funeral-independent-notes-v155.mjs scripts/test-later-note-institutional-reconciliation-v156.mjs scripts/test-later-note-rejection-revocation-v157.mjs scripts/test-chancery-picker-rls-v158.mjs scripts/test-reconciliation-all-sacraments-v159.mjs scripts/test-browser-reconciliation-v160.mjs scripts/test-reconciliation-keyset-v161.mjs scripts/test-session-isolation-v162.mjs scripts/test-release-gate-v163.mjs scripts/test-chat-session-isolation-v164.mjs scripts/test-chat-message-order-lifecycle-v165.mjs scripts/test-chat-history-keyset-v166.mjs scripts/test-reconciliation-conflicting-transitions-v167.mjs scripts/test-multinote-batch-v168.mjs scripts/test-reconciliation-session-guards-v169.mjs scripts/test-reconciliation-sensitive-ui-v170.mjs scripts/test-notification-archive-active-profile-v171.mjs scripts/test-bishop-tenure-jurisdiction-v172.mjs scripts/test-historical-active-parish-v173.mjs scripts/test-complete-sql-inventory-v174.mjs scripts/test-anonymous-perimeter-v175.mjs scripts/test-fail-closed-institutional-identity-v176.mjs scripts/test-pending-sacrament-authorization-v177.mjs scripts/test-seating-scope-v178.mjs scripts/test-chancery-decree-fail-closed-v179.mjs scripts/test-chat-notification-fail-closed-v180.mjs scripts/test-managed-access-physical-params-v181.mjs scripts/test-juridical-reconciliation-identity-v182.mjs scripts/test-production-secrets-v183.mjs scripts/test-authorization-metadata-v184.mjs scripts/test-foreign-key-contract-v185.mjs scripts/test-institutional-branding-v186.mjs scripts/test-numbering-integrity-v188.mjs scripts/test-decree-check-validation-v189.mjs scripts/test-privileged-search-path-v190.mjs scripts/test-chancery-delegation-v191.mjs scripts/test-functional-block-roles-boletas-v192.mjs scripts/test-four-sacrament-seating-v193.mjs scripts/test-registry-print-canonical-v194.mjs scripts/test-print-visual-v195.mjs scripts/test-print-buttons-browser-v196.mjs scripts/test-four-role-parish-isolation-v197.mjs scripts/test-interdiocese-and-seating-integrity-v198.mjs scripts/test-seated-boleta-protection-v199.mjs scripts/test-numeric-unique-locations-v200.mjs scripts/test-atomic-batch-and-stale-recovery-v201.mjs scripts/test-marriage-funeral-atomicity-v202.mjs scripts/test-real-statement-timeout-v203.mjs scripts/test-uniform-sacramental-lock-order-v204.mjs scripts/test-seat-recovery-browser-v205.mjs scripts/test-three-sacrament-recovery-v206.mjs scripts/test-idempotent-pending-creation-v207.mjs scripts/test-live-auth-safety-v208.mjs scripts/test-password-recovery-v208.mjs scripts/test-debug-auth-contract-v208.mjs scripts/test-auth-profile-identity-v209.mjs scripts/test-scoped-dynamic-details-v209.mjs scripts/test-real-transactional-workflows-v210.mjs scripts/test-decree-detail-reliability-v211.mjs scripts/test-legacy-migration-preflight-v212.mjs scripts/test-legacy-scope-isolation-v213.mjs scripts/test-protected-main-release-v213.mjs scripts/test-reported-reconciliation-v214.mjs scripts/test-marriage-historical-scope-v215.mjs scripts/test-marginal-note-scope-v216.mjs scripts/test-generic-legacy-link-guard-v217.mjs scripts/test-chancery-historical-review-v218.mjs scripts/test-candidate-triage-and-testmode-v219.mjs
      - name: Verificadores históricos sin credenciales
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/verify-*.mjs; do
            if [[ "$file" == "scripts/verify-latest-legacy-imports.mjs" ]]; then
              echo "OMITIDO en CI: necesita una sesión de lectura Supabase; se ejecuta por separado con permisos autorizados."
              continue
            fi
            node "$file"
          done
      - name: Compilación de producción
        run: npm run build
      - name: Verificar utilidades visuales usadas por paneles
        run: node scripts/check-critical-css-v91.mjs

  seguridad-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Dependencias de producción sin vulnerabilidades
        run: npm audit --omit=dev --audit-level=low
      - name: Todas las dependencias, incluidas las herramientas de compilación
        run: npm audit --audit-level=low
