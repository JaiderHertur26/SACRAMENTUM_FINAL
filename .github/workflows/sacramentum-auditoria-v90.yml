        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/verify-*.mjs; do
            if [[ "$file" == "scripts/verify-latest-legacy-imports.mjs" ]]; then
              echo "OMITIDO en CI: necesita una sesión de lectura Supabase; se ejecuta por separado con permisos autorizados."
              continue
            fi
            node "$file"
          done
      - name: Compilación de producción
        run: npm run build
      - name: Verificar utilidades visuales usadas por paneles
        run: node scripts/check-critical-css-v91.mjs

  seguridad-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Dependencias de producción sin vulnerabilidades
        run: npm audit --omit=dev --audit-level=low
      - name: Todas las dependencias, incluidas las herramientas de compilación
        run: npm audit --audit-level=low

  ensayo-restauracion-postgres-v247:
    name: Respaldo y restauracion REAL de PostgreSQL ficticio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_fixture_not_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Ejecutar backup logico y restore en DB independiente, solo fixtures
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci-postgres-restore-drill-v247.sh

  revision-visual-eclesial-v249:
    name: Recorrido visual eclesial · tres roles, sin Administrador General
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
