name: SACRAMENTUM - Auditoría V90

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-funcionales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Ensayos sintéticos sin acceso a producción
        run: node --test scripts/test-sistema-integral-v89.mjs scripts/test-chancery-decrees-v88.mjs scripts/test-supplementary-preflight-v89.mjs scripts/test-privileged-sequences-v92.mjs scripts/test-pending-ownership-v93.mjs scripts/test-parish-book-ownership-v94.mjs scripts/test-parish-auxiliary-ownership-v95.mjs scripts/test-institutional-identity-v96.mjs scripts/test-decree-concept-authority-v97.mjs scripts/test-legacy-concept-provenance-v98.mjs scripts/test-legacy-import-provenance-v99.mjs scripts/test-legacy-role-scope-v100.mjs scripts/test-legacy-admin-unscoped-v101.mjs scripts/test-document-authority-v102.mjs scripts/test-historical-maintenance-privileges-v103.mjs scripts/test-decree-authority-v104.mjs scripts/test-nullity-baptism-link-v105.mjs scripts/test-nullity-receipt-authority-v106.mjs scripts/test-nullity-judicial-review-v107.mjs scripts/test-nullity-court-correspondence-v108.mjs scripts/test-court-decision-receipt-v109.mjs scripts/test-dual-control-court-receipts-v110.mjs scripts/test-migration-provenance-v112.mjs scripts/test-complete-fictional-decree-matrix-v114.mjs scripts/test-register-effects-migrations-v116.mjs scripts/test-legacy-decrees-v118.mjs scripts/test-browser-and-historical-rls-v120.mjs scripts/test-physical-provenance-rls-v121.mjs scripts/test-rpc-hardening-v123.mjs scripts/test-shadow-role-authority-v124.mjs scripts/test-matrimonial-scope-and-historical-import-v126.mjs scripts/test-tailwind4-dependency-remediation-v127.mjs scripts/test-nullity-institutional-preflight-v130.mjs scripts/test-nullity-browser-v131.mjs scripts/test-marginal-receipt-authority-v133.mjs scripts/test-physical-notification-guard-v134.mjs scripts/test-stale-registral-reversals-v135.mjs scripts/test-stale-baptism-confirmation-v136.mjs scripts/test-later-linked-decree-v137.mjs scripts/test-unique-reversal-audit-snapshot-v138.mjs scripts/test-official-notification-and-print-v139.mjs scripts/test-registry-print-marginal-integrity-v140.mjs scripts/test-print-receipt-consistency-v142.mjs scripts/test-stale-print-coordinates-v143.mjs scripts/test-print-request-lineage-v146.mjs scripts/test-monotonic-sacrament-version-v148.mjs scripts/test-registry-version-microseconds-v149.mjs scripts/test-parish-authorization-fail-closed-v150.mjs scripts/test-legacy-materializer-role-scope-v151.mjs scripts/test-rpc-inventory-reconciliation-v151.mjs scripts/test-documentary-decree-lifecycle-v152.mjs scripts/test-baptism-confirmation-decree-integrity-v153.mjs scripts/test-independent-marginal-note-chain-v154.mjs scripts/test-marriage-funeral-independent-notes-v155.mjs scripts/test-later-note-institutional-reconciliation-v156.mjs scripts/test-later-note-rejection-revocation-v157.mjs scripts/test-chancery-picker-rls-v158.mjs scripts/test-reconciliation-all-sacraments-v159.mjs scripts/test-browser-reconciliation-v160.mjs scripts/test-reconciliation-keyset-v161.mjs scripts/test-session-isolation-v162.mjs scripts/test-release-gate-v163.mjs
      - name: Verificadores históricos sin credenciales
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/verify-*.mjs; do
            if [[ "$file" == "scripts/verify-latest-legacy-imports.mjs" ]]; then
              echo "OMITIDO en CI: necesita una sesión de lectura Supabase; se ejecuta por separado con permisos autorizados."
              continue
            fi
            node "$file"
          done
      - name: Compilación de producción
        run: npm run build
      - name: Verificar utilidades visuales usadas por paneles
        run: node scripts/check-critical-css-v91.mjs

  seguridad-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalación reproducible
        run: npm ci
      - name: Dependencias de producción sin vulnerabilidades
        run: npm audit --omit=dev --audit-level=low
      - name: Todas las dependencias, incluidas las herramientas de compilación
        run: npm audit --audit-level=low
